name: Java CI Combined

on: [push, pull_request, workflow_dispatch]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
      lucee_matrix: ${{ steps.lucee-matrix.outputs.MATRIX }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Extract version number
        id: extract-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # Repository and organization variables are not passed to pull_request runs from forks, so
      # vars.LUCEE_TEST_VERSIONS_PLUS is empty there and fromJSON('') fails the run before build-and-test starts.
      # Use the variable when it is set, otherwise test the latest build of each Lucee line through
      # a version query (script-runner resolves it), so fork PRs are tested too.
      - name: Resolve Lucee test matrix
        id: lucee-matrix
        env:
          TEST_VERSIONS: ${{ vars.LUCEE_TEST_VERSIONS_PLUS }}
          FALLBACK_LINES: "6.2 7.0 7.1 8.0 9.0"
          # LDEV-6911: the extension must install on Lucee 8.0 and 9.0, so they are always tested
          REQUIRED_LINES: "8.0 9.0"
        run: |
          set -euo pipefail
          if [[ -n "${TEST_VERSIONS// }" ]] && echo "$TEST_VERSIONS" | jq -e 'type == "array" and length > 0' > /dev/null; then
            echo "Using vars.LUCEE_TEST_VERSIONS_PLUS"
            MATRIX=$(echo "$TEST_VERSIONS" | jq -c '.')
          else
            echo "::notice::vars.LUCEE_TEST_VERSIONS_PLUS is not available (fork pull request?), testing the latest build of: ${FALLBACK_LINES}"
            MATRIX=$(printf '%s\n' $FALLBACK_LINES | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({version: (. + "/all/light"), query: (. + "/all/light")})')
          fi
          for LINE in $REQUIRED_LINES; do
            if ! echo "$MATRIX" | jq -e --arg l "$LINE" 'any(.[]; ((.query // "") | startswith($l + "/")) or ((.version // "") | test("^[a-z]*-?" + ($l | gsub("\\."; "\\.")) + "\\.")))' > /dev/null; then
              echo "Adding the latest ${LINE} build to the matrix"
              MATRIX=$(echo "$MATRIX" | jq -c --arg l "$LINE" '. + [{version: ($l + "/all/light"), query: ($l + "/all/light")}]')
            fi
          done
          # artifact names cannot contain "/", so give every entry a label
          MATRIX=$(echo "$MATRIX" | jq -c 'map(. + {label: ((.version // .query) | gsub("[^A-Za-z0-9._-]"; "-"))})')
          echo "Lucee test matrix: ${MATRIX}"
          echo "MATRIX=${MATRIX}" >> "$GITHUB_OUTPUT"

      - name: Cache Lucee files
        uses: actions/cache@v4
        with:
          path: ~/work/_actions/lucee/script-runner/main/lucee-download-cache
          key: lucee-downloads

  build-and-test:
    runs-on: ubuntu-latest
    needs: setup
    services:
      oracle:
        image: gvenzl/oracle-xe:18
        env:
          ORACLE_PASSWORD: lucee_system
          APP_USER: lucee
          APP_USER_PASSWORD: lucee_oracle
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      LUCEE_TEST_VERSIONS_PLUS: ${{ vars.LUCEE_TEST_VERSIONS_PLUS }}
    strategy:
      fail-fast: false
      matrix:
        lucee: ${{ fromJSON(needs.setup.outputs.lucee_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Install with Maven
        run: |
          echo "------- Maven Install -------";
          mvn -B -e -f pom.xml clean install

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-lex-${{ matrix.lucee.label }}
          path: target/*.lex

      - name: Checkout Lucee
        uses: actions/checkout@v4
        with:
          repository: lucee/lucee
          ref: "7.0"
          path: lucee

      - name: Prepare extension dir for tests
        run: rm -f target/*.lite.lex

      - name: Log Lucee test matrix version
        run: |
          echo "Matrix lucee.version: ${{ matrix.lucee.version }}"
          echo "Matrix lucee.query: ${{ matrix.lucee.query }}"
          if [ -n "${{ matrix.lucee.query }}" ]; then
            echo "Note: script-runner uses luceeVersionQuery when set; it overrides luceeVersion."
          fi

      - name: Run Lucee Test Suite
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/test
          execute: /bootstrap-tests.cfm
          luceeVersion: ${{ matrix.lucee.version }}
          luceeVersionQuery: ${{ matrix.lucee.query }}
          extensionDir: ${{ github.workspace }}/target
        env:
          testLabels: oracle
          testAdditional: ${{ github.workspace }}/tests
          ORACLE_SERVER: localhost
          ORACLE_USERNAME: lucee
          ORACLE_PASSWORD: lucee_oracle
          ORACLE_PORT: 1521
          # gvenzl/oracle-xe creates APP_USER in the pluggable database XEPDB1, not in the XE container,
          # so connecting to XE failed with ORA-01017 and the database specs were skipped
          ORACLE_DATABASE: XEPDB1

  deploy:
    runs-on: ubuntu-latest
    needs: [setup, build-and-test]
    # Never publish from a pull request. A release (non -SNAPSHOT) version is only published by a manual
    # workflow_dispatch run, so merging a version bump does not release it on its own.
    if: >-
      always() && needs.build-and-test.result == 'success'
      && (github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && endsWith(needs.setup.outputs.version, '-SNAPSHOT')))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build and Deploy with Maven
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ "${{ needs.setup.outputs.version }}" == *-SNAPSHOT ]]; then
            echo "------- Maven Deploy snapshot on ${{ github.event_name }} -------";
            mvn -B -e -f pom.xml clean deploy --settings maven-settings.xml
          else
            echo "------- Maven Deploy release on ${{ github.event_name }} -------";
            mvn -B -e -f pom.xml clean deploy -DperformRelease=true --settings maven-settings.xml
          fi
